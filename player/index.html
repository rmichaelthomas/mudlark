<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mudlark — from bones to build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #283618;          /* Black Forest */
      --panel: #1f2a12;       /* Black Forest, darkened for panel contrast */
      --border: rgba(254, 250, 224, 0.12);  /* Cornsilk at low opacity */
      --text: #FEFAE0;        /* Cornsilk */
      /* Olive Leaf (#606C38) reads at 2.27:1 on Black Forest — below the
         4.5:1 WCAG AA floor for small text. Lightened along the same hue
         until it passes: 4.63:1 on --bg, 5.40:1 on --panel. */
      --muted: #94A167;
      --accent: #DDA15E;      /* Sunlit Clay */
      --accent-secondary: #BC6C25;  /* Copperwood */
      /* Copperwood on its own 15%-tint badge is 3.19:1; same treatment as
         --muted, lightened toward Sunlit Clay until it clears AA (4.61:1). */
      --accent-secondary-text: #D98A45;
      --accent-tertiary: #902E47;   /* Vintage Berry */
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "system-ui", sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    header .tagline {
      font-style: italic;
      font-size: 12px;
    }
    header .subject {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      margin-left: auto;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 0;
      min-height: 0;
    }
    #viewport {
      overflow: auto;
      min-height: 0;
      padding: 32px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        linear-gradient(rgba(254, 250, 224, 0.03) 1px, transparent 1px) 0 0 / 100% 24px,
        var(--bg);
    }
    #frame {
      position: relative;
      background: #16200c;
      box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0, 0, 0, 0.5);
      flex: none;
    }
    #stage {
      position: absolute;
      inset: 0;
    }
    aside {
      border-left: 1px solid var(--border);
      padding: 20px;
      overflow-y: auto;
      background: var(--panel);
    }
    aside h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    #register-wrap { margin-bottom: 20px; }
    #register-wrap label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    #register {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
    }

    #detail { margin-bottom: 24px; }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .detail-sha {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      background: rgba(188, 108, 37, 0.15);
      color: var(--accent-secondary-text);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .detail-date, .detail-author { font-size: 12px; color: var(--muted); }
    .detail-message { margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
    .detail-offregister {
      margin: 0;
      padding: 8px 10px;
      border-left: 2px solid var(--accent);
      background: rgba(221, 161, 94, 0.08);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
      border-radius: 0 4px 4px 0;
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin: 0 0 24px;
    }
    fieldset legend {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0 4px;
    }
    fieldset label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
    }
    fieldset input[type="checkbox"] { accent-color: var(--accent); }
    .layer-desc {
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
      margin-left: 4px;
    }

    .shortcuts {
      margin: 0;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }
    .shortcuts kbd {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      color: var(--text);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #play {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      min-width: 72px;
    }
    #speed {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    #scrub { flex: 1; accent-color: var(--accent); }
    .commit-count {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
      font-size: 12px;
      min-width: 56px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #rail {
      position: relative;
      height: 28px;
    }
    .rail-track {
      position: relative;
      height: 100%;
      background: rgba(254, 250, 224, 0.04);
      border-radius: 4px;
    }
    .rail-mark {
      position: absolute;
      top: 0;
      height: 100%;
      min-width: 3px;
      background: rgba(221, 161, 94, 0.35);
      border: none;
      border-right: 1px solid var(--bg);
      cursor: pointer;
      padding: 0;
    }
    .rail-mark:hover { background: rgba(221, 161, 94, 0.6); }
    .rail-mark.active { background: var(--accent); }
    .rail-playhead {
      position: absolute;
      top: -3px;
      width: 2px;
      height: calc(100% + 6px);
      background: #fff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mudlark</h1>
    <p class="tagline">from bones to build</p>
    <p class="subject" id="subject-label"></p>
  </header>

  <main>
    <div id="viewport">
      <div id="frame"><div id="stage"></div></div>
    </div>
    <aside>
      <div id="register-wrap"></div>

      <h2>Detail</h2>
      <div id="detail"></div>

      <fieldset>
        <legend>Layers</legend>
        <label><input type="checkbox" data-layer-toggle="structure" /> Structure <span class="layer-desc">elements and nesting</span></label>
        <label><input type="checkbox" data-layer-toggle="layout" /> Layout <span class="layer-desc">position, size, spacing</span></label>
        <label><input type="checkbox" data-layer-toggle="surface" /> Surface <span class="layer-desc">color, border, shadow</span></label>
        <label><input type="checkbox" data-layer-toggle="content" /> Content <span class="layer-desc">text, type, images</span></label>
        <label><input type="checkbox" data-layer-toggle="behavior" /> Behavior <span class="layer-desc">script, motion, interaction</span></label>
      </fieldset>

      <h2>Shortcuts</h2>
      <p class="shortcuts">
        <kbd>Space</kbd> play / pause<br />
        <kbd>←</kbd> <kbd>→</kbd> previous / next commit
      </p>
    </aside>
  </main>

  <footer>
    <div id="rail"></div>
    <div class="transport">
      <button type="button" id="play">Play</button>
      <select id="speed" aria-label="Playback speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
      <input type="range" id="scrub" value="0" />
      <span id="commit-count" class="commit-count"></span>
    </div>
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
